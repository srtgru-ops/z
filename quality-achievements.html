<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b8a50"><title>إنجازات الجودة والتطوير | عمادة شؤون الطلاب</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#0b8a50;--d:#06492f;--s:#e8f5ee;--gold:#b69a20;--gs:#f7f0d4;--t:#183027;--m:#687d73;--b:#dce9e1;--w:#fff;--r:#b42318;--sh:0 12px 34px rgba(5,78,46,.1)}*{box-sizing:border-box}body{margin:0;color:var(--t);font-family:Tajawal,Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#f9fbfa,#eef5f1);min-height:100vh}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{background:rgba(255,255,255,.92);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.top .shell{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Cairo;font-weight:900;color:var(--d)}.home{color:var(--d);text-decoration:none;border:1px solid var(--b);background:#fff;padding:10px 15px;border-radius:12px;font-weight:800}.hero{padding:38px 0 24px}.hero-box{background:linear-gradient(125deg,var(--d),var(--g));color:#fff;padding:32px;border-radius:28px;box-shadow:0 20px 45px rgba(6,73,47,.2)}h1{font-family:Cairo;margin:0 0 8px;font-size:clamp(26px,4vw,42px)}.hero p{margin:0;color:rgba(255,255,255,.82);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat,.panel{background:#fff;border:1px solid var(--b);box-shadow:var(--sh)}.stat{border-radius:18px;padding:18px}.stat span{display:block;color:var(--m);font-size:13px}.stat strong{display:block;color:var(--d);font-family:Cairo;font-size:28px;margin-top:5px}.panel{border-radius:22px;padding:22px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}.panel h2{font-family:Cairo;margin:0;color:var(--d);font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}label{display:block;font-weight:800;font-size:13px;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #cfded5;border-radius:12px;padding:12px 13px;font:inherit;color:var(--t);background:#fff}textarea{min-height:96px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid rgba(11,138,80,.12);border-color:var(--g)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:var(--s);color:var(--d)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}.empty{text-align:center;color:var(--m);padding:34px 10px;border:1px dashed #cbdcd2;border-radius:16px}.cards{display:grid;gap:13px}.item{border:1px solid var(--b);border-radius:17px;padding:17px;background:#fcfefd}.item h3{font-family:Cairo;margin:0 0 6px;font-size:17px;color:var(--d)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--m);font-size:12px}.pill{padding:5px 9px;border-radius:999px;background:var(--s);color:var(--d);font-weight:800}.pill.gold{background:var(--gs);color:#776313}.item p{line-height:1.75;margin:13px 0;color:#40584d}.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{border:0;border-radius:10px;padding:8px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;background:var(--s);color:var(--d)}.mini.danger{background:#fff1f0;color:var(--r)}.evidence{margin-top:10px;padding-top:10px;border-top:1px solid var(--b);font-size:12px}.evidence a{display:inline-block;margin:4px 0 0 6px;color:var(--g);font-weight:800}.note{font-size:12px;color:var(--m);margin-top:8px}.toast{position:fixed;left:20px;bottom:20px;background:var(--d);color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.hero-box{padding:24px}.top .shell{min-height:64px}}
</style></head><body><header class="top"><div class="shell"><div class="brand">عمادة شؤون الطلاب · جامعة تبوك</div><a class="home" href="index.html">الرئيسية</a></div></header><main><section class="hero"><div class="shell"><div class="hero-box"><h1>إنجازات الجودة والتطوير</h1><p>سجل موحد لتوثيق الإنجازات، متابعة حالتها، وإرفاق الشواهد والملاحظات.</p></div><div class="stats"><div class="stat"><span>إجمالي الإنجازات</span><strong id="sAll">0</strong></div><div class="stat"><span>مكتمل</span><strong id="sDone">0</strong></div><div class="stat"><span>قيد التنفيذ</span><strong id="sDoing">0</strong></div><div class="stat"><span>الشواهد المرفوعة</span><strong id="sFiles">0</strong></div></div></div></section><section class="shell"><div class="panel" id="formPanel"><div class="panel-head"><h2 id="formTitle">إضافة إنجاز جديد</h2><button class="btn secondary" id="toggleForm" type="button">إخفاء النموذج</button></div><form id="achievementForm"><input type="hidden" id="editId"><div class="grid"><div><label for="title">اسم الإنجاز *</label><input id="title" required placeholder="مثال: تطوير خطة النشاط الرياضي"></div><div><label for="category">التصنيف *</label><select id="category" required><option value="">اختاري التصنيف</option><option>جودة</option><option>تطوير</option><option>متابعة</option><option>تقرير</option><option>منصة</option><option>مبادرة</option></select></div><div><label for="date">تاريخ الإنجاز *</label><input id="date" type="date" required></div><div><label for="status">الحالة *</label><select id="status" required><option>قيد التنفيذ</option><option>مكتمل</option><option>متوقف</option></select></div><div><label for="department">الإدارة أو القسم المستفيد</label><input id="department" placeholder="اسم الإدارة أو القسم"></div><div><label for="owner">اسم منفّذة الإنجاز *</label><input id="owner" required placeholder="الاسم الكامل"></div><div class="full"><label for="description">وصف الإنجاز *</label><textarea id="description" required placeholder="اكتبي وصفًا مختصرًا وواضحًا للإنجاز"></textarea></div><div class="full"><label for="evidence">الشواهد</label><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"><div class="note">يمكن إرفاق صور أو PDF أو Word أو Excel. تُحفظ الملفات في هذا المتصفح.</div></div><div class="full"><label for="notes">الملاحظات</label><textarea id="notes" placeholder="أي ملاحظات إضافية"></textarea></div><div class="full actions"><button class="btn primary" type="submit">حفظ الإنجاز</button><button class="btn secondary" id="cancelEdit" type="button" hidden>إلغاء التعديل</button></div></div></form></div><div class="panel"><div class="panel-head"><h2>سجل الإنجازات</h2><button class="btn primary" type="button" id="showForm">+ إضافة إنجاز</button></div><div class="filters"><input id="search" placeholder="ابحثي باسم الإنجاز أو المنفّذة أو الإدارة"><select id="filterCategory"><option value="">كل التصنيفات</option><option>جودة</option><option>تطوير</option><option>متابعة</option><option>تقرير</option><option>منصة</option><option>مبادرة</option></select><select id="filterStatus"><option value="">كل الحالات</option><option>قيد التنفيذ</option><option>مكتمل</option><option>متوقف</option></select></div><div id="list" class="cards"></div></div></section></main><div id="toast" class="toast"></div><script>
var KEY='ut_quality_achievements_v1',rows=[];function el(id){return document.getElementById(id)}function esc(s){return String(s||'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}function load(){try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rows=[]}render()}function save(){localStorage.setItem(KEY,JSON.stringify(rows))}function toast(m){el('toast').textContent=m;el('toast').classList.add('show');setTimeout(function(){el('toast').classList.remove('show')},2200)}function stats(){el('sAll').textContent=rows.length;el('sDone').textContent=rows.filter(function(x){return x.status==='مكتمل'}).length;el('sDoing').textContent=rows.filter(function(x){return x.status==='قيد التنفيذ'}).length;el('sFiles').textContent=rows.reduce(function(n,x){return n+((x.files||[]).length)},0)}
function card(x){var files=(x.files||[]).length?x.files.map(function(f){return '<a href="'+f.data+'" download="'+esc(f.name)+'">'+esc(f.name)+'</a>'}).join(''):'لا توجد شواهد';return '<article class="item"><h3>'+esc(x.title)+'</h3><div class="meta"><span class="pill">'+esc(x.category)+'</span><span class="pill gold">'+esc(x.status)+'</span><span>'+esc(x.date)+'</span>'+(x.department?'<span>· '+esc(x.department)+'</span>':'')+'</div><p>'+esc(x.description)+'</p><div class="meta"><strong>المنفّذة:</strong> '+esc(x.owner)+'</div>'+(x.notes?'<div class="note"><strong>ملاحظات:</strong> '+esc(x.notes)+'</div>':'')+'<div class="evidence"><strong>الشواهد:</strong> '+files+'</div><div class="item-actions"><button class="mini" onclick="editRow(\''+x.id+'\')">تعديل</button><button class="mini danger" onclick="removeRow(\''+x.id+'\')">حذف</button></div></article>'}
function render(){stats();var q=el('search').value.trim().toLowerCase(),cat=el('filterCategory').value,st=el('filterStatus').value;var data=rows.filter(function(x){return(!cat||x.category===cat)&&(!st||x.status===st)&&(!q||[x.title,x.owner,x.department,x.description].join(' ').toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.date.localeCompare(a.date)});el('list').innerHTML=data.length?data.map(card).join(''):'<div class="empty">لا توجد إنجازات مطابقة حاليًا.</div>'}function readFiles(files){return Promise.all(Array.from(files).map(function(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res({name:f.name,type:f.type,size:f.size,data:r.result})};r.onerror=rej;r.readAsDataURL(f)})}))}
el('achievementForm').addEventListener('submit',async function(e){e.preventDefault();var id=el('editId').value,old=rows.find(function(x){return x.id===id}),files=old?old.files||[]:[];if(el('evidence').files.length)files=files.concat(await readFiles(el('evidence').files));var item={id:id||String(Date.now()),title:el('title').value.trim(),category:el('category').value,date:el('date').value,status:el('status').value,department:el('department').value.trim(),owner:el('owner').value.trim(),description:el('description').value.trim(),notes:el('notes').value.trim(),files:files};if(id)rows=rows.map(function(x){return x.id===id?item:x});else rows.push(item);try{save()}catch(err){toast('حجم الشواهد كبير؛ قللي حجم الملفات');return}resetForm();render();toast(id?'تم تحديث الإنجاز':'تم حفظ الإنجاز')});function editRow(id){var x=rows.find(function(r){return r.id===id});if(!x)return;el('editId').value=x.id;['title','category','date','status','department','owner','description','notes'].forEach(function(k){el(k).value=x[k]||''});el('formTitle').textContent='تعديل الإنجاز';el('cancelEdit').hidden=false;el('achievementForm').hidden=false;scrollTo({top:0,behavior:'smooth'})}function removeRow(id){if(!confirm('هل تريدين حذف هذا الإنجاز؟'))return;rows=rows.filter(function(x){return x.id!==id});save();render();toast('تم حذف الإنجاز')}function resetForm(){el('achievementForm').reset();el('editId').value='';el('formTitle').textContent='إضافة إنجاز جديد';el('cancelEdit').hidden=true;el('date').value=new Date().toISOString().slice(0,10)}el('cancelEdit').onclick=resetForm;el('search').oninput=render;el('filterCategory').onchange=render;el('filterStatus').onchange=render;el('toggleForm').onclick=function(){el('achievementForm').hidden=!el('achievementForm').hidden;el('toggleForm').textContent=el('achievementForm').hidden?'إظهار النموذج':'إخفاء النموذج'};el('showForm').onclick=function(){el('achievementForm').hidden=false;scrollTo({top:0,behavior:'smooth'})};resetForm();load();
</script></body></html>
